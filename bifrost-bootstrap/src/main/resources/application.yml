spring:
  application:
    name: bifrost
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false

server:
  port: 8080

bifrost:
  db:
    path: ./data/bifrost.db
  library:
    roots: []
  media:
    cover-cache-dir: ./data/covers
  scan:
    cron: "0 3 * * *"
    batch-size: 200
  auth:
    initial-username: admin
  subsonic:
    enabled: true
    api-version: 1.16.1
